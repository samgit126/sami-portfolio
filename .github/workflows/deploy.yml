name: Deploy to GitHub Pages

# ONE-TIME SETUP, required before this workflow can succeed:
#   Repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# Without it, actions/configure-pages fails with:
#   "Get Pages site failed ... Not Found"
# (The action's `enablement: true` input can create the site automatically, but
# it needs a PAT or GitHub App token — GITHUB_TOKEN is not sufficient.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Project pages live at /<repo>/, so the base path must match the repo name.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
